name: Synchronize official content
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: mirror-writes
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'General-c4/portwatch-vi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arabic-rtl-localization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - run: npm ci --prefix automation --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/translation-requirements.txt
      - run: pip install -r automation/translation-requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/portwatch-models
          key: portwatch-en-ar-e2a6e843-v1
      - name: Validate, synchronize and queue/translate changed text
        id: sync
        run: node automation/content-sync.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          API_ANYTHING_LOCAL_ONLY: '1'
          PW_API_REPAIR: '1'
          PW_TRANSLATION_PROVIDER: offline
          PW_TRANSLATION_LIMIT: '40'
          PW_MODEL_CACHE: /home/runner/.cache/portwatch-models
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_NEWS_MAX_REQUESTS: '3'
          GEMINI_NEWS_DAILY_REQUESTS: '20'
          GEMINI_NEWS_DAILY_TOKENS: '100000'
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Commit only changed content/state
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'portwatch-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data assets/i18n/*auto*.json assets/i18n/content/*auto.json assets/i18n/dashboard/*auto.json assets/i18n/news/ar.json automation/state
          if ! git diff --cached --quiet; then
            git commit -m 'sync: official content and validated Arabic translations'
            git push origin HEAD:feat/arabic-rtl-localization
          fi
      - name: Dispatch validated deployment after sync commit
        if: steps.sync.outputs.publish == 'true'
        run: gh workflow run arabic-preview.yml --ref feat/arabic-rtl-localization
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Notify the independent source-integration pipeline when upstream advances
        if: steps.sync.outputs.upstream_changed == 'true'
        run: gh workflow run source-sync.yml --ref feat/arabic-rtl-localization
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Monitoring report (separate from public interface)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-sync-status
          path: .sync/*.json
          include-hidden-files: true
          retention-days: 7
