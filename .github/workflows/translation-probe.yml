name: Verify free translation providers
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror-writes
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'General-c4/portwatch-vi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/arabic-rtl-localization
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix automation --ignore-scripts --no-audit --no-fund
      - run: node automation/translation-probe.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          TRANSLATION_FREE_PROVIDERS: ${{ vars.TRANSLATION_FREE_PROVIDERS || 'gemini' }}
      - name: Preserve real request reservations and cooldowns
        if: always()
        run: |
          git config user.name 'portwatch-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/state/translation-providers.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: record free provider probe usage and cooldowns'
            git push origin HEAD:feat/arabic-rtl-localization
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provider-probe
          path: .sync/provider-probe.json
          include-hidden-files: true
          retention-days: 7
