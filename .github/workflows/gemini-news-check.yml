name: Gemini news API check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'General-c4/portwatch-vi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix automation --ignore-scripts --no-audit --no-fund
      - name: One synthetic news article; never published
        run: node automation/gemini-news-smoke.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-news-check
          path: .sync/gemini-news-smoke.json
          retention-days: 7
