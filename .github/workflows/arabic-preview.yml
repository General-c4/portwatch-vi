name: Arabic localization preview
on:
  push:
    branches: [feat/arabic-rtl-localization]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: arabic-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.repository_owner != '4lwayz'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node scripts/preview-build.mjs
        env:
          PW_PREVIEW: '1'
          PW_REFRESH_UPSTREAM: '1'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
