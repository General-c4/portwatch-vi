name: Arabic localization preview
on:
  push:
    branches: [feat/arabic-rtl-localization]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository_owner != '4lwayz'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --prefix automation --ignore-scripts --no-audit --no-fund
      - run: npx --prefix automation playwright install --with-deps chromium
      - name: Arabic and English desktop/tablet/mobile regression gate
        run: node automation/verify-source-browser.mjs .
        env:
          PW_BROWSER: chromium
      - run: node scripts/preview-build.mjs
        env:
          PW_PREVIEW: '1'
      - name: Scoped news translation browser regression
        run: node automation/gemini-news-browser.mjs _site
        env:
          PW_BROWSER: chromium
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 15
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - name: Verify live commit, data, translations and article URLs
        run: node automation/verify-deployment.mjs
      - name: Recover the last tested artifact after a deployment-service failure
        if: failure() && steps.retry.outcome == 'failure'
        id: rollback
        run: python automation/rollback.py
        env:
          GH_TOKEN: ${{ github.token }}
      - if: failure() && steps.rollback.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-rollback
          path: .sync/rollback/site
      - if: failure() && steps.rollback.outcome == 'success'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-rollback
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification
          path: .sync/deployment-status.json
          retention-days: 7
